# page3.yaml: the words on your Week 3 page. make_page3.py puts each answer under its question.
# A few sentences each, in your own words, about YOUR network and YOUR evidence.
# Leave a blank line between paragraphs. Never put your name or full student ID here.

repository: https://github.com/jakejakeeee/Lab_ProgrammableNetwork

answers:
  design:
    question: "Describe your design: why these routers, LANs and links, and how you chose the addresses."
    answer: |
      I designed a 4 router and create like diamond topology (r1, r2, r3, r4) where r1 and r4 are connected via two parallel paths (through r2 and r3). This creates a physical redundant loop. Each router hosts one LAN. 
      
      For addressing, I used my designated block 10.8.0.0/16. I deliberately assigned 10.8.1.0/24 and 10.8.2.0/24 to the left side (h1, h2), and 10.8.32.0/24 and 10.8.33.0/24 to the right side (h3, h4). I chose 10.8.32.0/24 and 10.8.33.0/24, so it can lets r1 use one route, 10.8.32.0/23, instead of two.

  summary:
    question: "Which route summarises several LANs? Which networks does it cover, why is it correct, and what else would it attract if you added a network inside its range?"
    answer: |
       On r1, I added the summary route 10.8.32.0/23 with r3 as the next hop. It covers both 10.8.32.0/24 (h3's LAN) and 10.8.33.0/24 (h4's LAN) in a single entry. It is correct because, from r1's point of view, both LANs are reached in the same direction. 
       The risk is that the summary also covers addresses I haven't used. If I added a new network inside its range, such as 10.8.33.128/25 behind r2, r1 would still send that traffic to r3. The packets would go the wrong way and never arrive.

  failure:
    question: "When you took a link down, what happened, and why couldn't your routes recover even though another path existed? What would have recovered?"
    answer: |
       When I took the r1-r3 link down, traffic from h1 to h4 failed with a "Network Unreachable" error. A backup path through r2 still existed, but my routes were static. r1 had only one instruction for h4's traffic, which is send it out toward r3. It had no way to notice the failure and choose another path.
       A dynamic routing protocol such as OSPF would have recovered. It would have detected the failed link and recalculated the routes on its own, moving the traffic onto the path through r2.

  control_plane:
    question: "In your network, what was the control plane? Who worked out the routes, and what does that mean for a network of 40 routers?"
    answer: |
      In this network, I acted as the control plane. I manually calculated the subnets, determined the longest-prefix matches, figured out the summary routes, and typed them into the YAML data file. 
      
      While this is manageable for 4 routers, doing this by hand for a network of 40 routers would be impossible. It would require calculating thousands of individual static routes, making the network highly prone to human error, accidental loops, and outages. A 40-router network demands an automated control plane, like an SDN controller or dynamic routing protocols, to compute routes algorithmically.